name: Bug report
description: Something is broken or producing a wrong result
title: "bug: "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        **Do not report security vulnerabilities here.** See
        [SECURITY.md](https://github.com/ThinkAI-Studio/parapet/blob/main/SECURITY.md)
        for the private reporting process.

  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear description of the bug.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Add domain example.com
        2. Run a scan
        3. ...
    validations:
      required: true

  - type: input
    id: check-id
    attributes:
      label: Related check ID
      description: If this is a wrong scan result, which check is affected?
      placeholder: e.g. TLS-03, HDR-02

  - type: dropdown
    id: environment
    attributes:
      label: Where did you see it?
      options:
        - Production (parapet.dev)
        - Local development
        - GitHub App
        - Attack Range
        - Not applicable
    validations:
      required: true

  - type: textarea
    id: extra
    attributes:
      label: Anything else?
      description: Logs, screenshots, scan IDs. Redact anything sensitive.
