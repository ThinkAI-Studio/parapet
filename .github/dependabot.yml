version: 2

updates:
  # GitHub Actions is the only ecosystem that exists today (docs repo).
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Asia/Ho_Chi_Minh
    open-pull-requests-limit: 3
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: chore
      include: scope
    labels:
      - dependencies

  # ---------------------------------------------------------------------------
